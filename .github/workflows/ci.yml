# CI/CD — mỗi lần push/PR: chạy test + build image trên máy sạch của GitHub.
# Chỉ khi cả hai xanh VÀ là push lên main thì mới deploy lên Render.
#
# Secret cần tạo (repo → Settings → Secrets and variables → Actions):
#   RENDER_DEPLOY_HOOK_URL — Render dashboard → day12-agent → Settings → Deploy Hook

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Push mới lên cùng nhánh thì hủy lần chạy cũ đang dở
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_URL: https://day12-agent-n3wm.onrender.com

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd kiểm tra badge
      # của chính workflow này → loại ra. Test build Docker để job `build` lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: |
          pytest tests/ -v -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Show image size
        run: docker images day12-agent:${{ github.sha }}

      # Build được chưa đủ — container phải khởi động và trả lời /health
      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "container không trả lời /health"; docker logs agent; exit 1

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Chưa tạo secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Đã gọi deploy hook của Render"

      # Render build + khởi động mất vài phút, free tier còn có cold start
      - name: Smoke test
        run: |
          sleep 45
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 "$PUBLIC_URL/health"; then
              echo; curl -fsS --max-time 30 "$PUBLIC_URL/ready"; echo
              exit 0
            fi
            sleep 15
          done
          echo "::error::$PUBLIC_URL/health không trả 200"; exit 1
